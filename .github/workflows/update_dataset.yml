name: Update PTF Dataset

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'


permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur
        run: |
          pip install pandas requests python-dotenv

      - name: PTF verisini güncelle
        env:
        EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
        EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: python update_dataset.py

      - name: KGÜP verisini güncelle
        env:
        EPIAS_USERNAME: ${{ secrets.EPIAS_USERNAME }}
        EPIAS_PASSWORD: ${{ secrets.EPIAS_PASSWORD }}
        run: python fetch_kgup_combined.py

      - name: GitHub'a kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "dataset auto update" || echo "No changes"
          git push
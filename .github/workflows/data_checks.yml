name: Data Checks

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  data-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run timezone scan
        run: |
          python scripts/check_timezones.py data || true

      - name: Run target coverage check
        run: |
          python scripts/check_target_coverage.py data/features || true

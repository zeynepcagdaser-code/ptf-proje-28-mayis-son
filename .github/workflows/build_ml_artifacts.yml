name: Build ML Artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ml-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run cleaning pipeline
        run: python -u run_cleaning.py

      - name: Build master dataset
        run: python -u build_master.py

      - name: Build feature dataset
        run: python -u build_features.py

      - name: Build sequence tensors
        run: python -u run_sequence.py

      - name: Commit and push ML artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/clean/*.parquet \
            data/master/*.parquet \
            data/features/*.parquet \
            data/model/feature_columns.json \
            data/model/target_columns.json \
            data/model/sequence_metadata.json \
            data/model/feature_scaler.pkl \
            data/model/target_scaler.pkl \
            data/model/anchor_*.csv \
            reports/cleaning_report_latest.json \
            reports/cleaning_report_latest.md \
            reports/master_report_latest.json \
            reports/master_report_latest.md \
            reports/features_report_latest.json \
            reports/features_report_latest.md \
            reports/sequence_report_latest.json \
            reports/sequence_report_latest.md

          if git diff --cached --quiet; then
            echo "No ML artifact changes to commit"
          else
            git commit -m "Update ML artifacts"
            git push
          fi
